_schema-version: 3.3.0
ID: TrainingSystem
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: TrainingSystem-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: TrainingSystem-auth
      - name: TrainingSystem-db
      - name: TrainingSystem-destination

  - name: TrainingSystem-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: TrainingSystem-db
  - name: TrainingSystem
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: TrainingSystem-auth
      - name: TrainingSystem-destination
      - name: TrainingSystem-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: TrainingSystem-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: TrainingSystememployeelearningportal
          artifacts:
            - employeelearningportal.zip
          target-path: app/
        - name: TrainingSystemtrainingmanager
          artifacts:
            - trainingmanager.zip
          target-path: app/
    requires:
      - name: TrainingSystem-auth
      - name: srv-api
      - name: TrainingSystem-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            HTML5.ForwardAuthToken: true
            HTML5.DynamicDestination: true

  - name: TrainingSystememployeelearningportal
    type: html5
    path: app/employeelearningportal
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: TrainingSystemtrainingmanager
    type: html5
    path: app/trainingmanager
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: TrainingSystem-destinations
    type: com.sap.application.content
    requires:
      - name: TrainingSystem-auth
        parameters:
          service-key:
            name: TrainingSystem-auth-key
      - name: TrainingSystem-html5-repo-host
        parameters:
          service-key:
            name: TrainingSystem-html5-repo-host-key
      - name: srv-api
      - name: TrainingSystem-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: TrainingSystem-html5-repository
              ServiceInstanceName: TrainingSystem-html5-repo-host
              ServiceKeyName: TrainingSystem-html5-repo-host-key
              sap.cloud.service: TrainingSystem.service
            - Name: TrainingSystem-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: TrainingSystem-auth
              ServiceKeyName: TrainingSystem-auth-key
              sap.cloud.service: TrainingSystem.service

resources:
  - name: TrainingSystem-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: TrainingSystem-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Employee (TrainingSystem ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Employee'
          - name: 'Manager (TrainingSystem ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Manager'
          - name: 'Administrator (TrainingSystem ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Administrator'
    requires:
      - name: app-api
  - name: TrainingSystem-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: TrainingSystem-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: TrainingSystem-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: TrainingSystem-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
